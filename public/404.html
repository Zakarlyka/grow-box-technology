<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grow Box Technology</title>
    <script>
        // Single Page Application for GitHub Pages
        // https://github.com/rafgraph/spa-github-pages
        // Start single page app as a GitHub Pages 404 page for React Router
        (function(l) {
            if (l.search[1] === '/' ) {
                var decoded = l.search.slice(1).split('&').map(function(s) { 
                    return s.replace(/~and~/g, '&')
                }).join('?');
                window.history.replaceState(null, null,
                    l.pathname.slice(0, -1) + decoded + l.hash
                );
            }
        }(window.location))
    </script>
</head>
<body>
    <div id="root"></div>
    <script type="module" src="/grow-box-technology/src/main.tsx"></script>
</body>
</html>
